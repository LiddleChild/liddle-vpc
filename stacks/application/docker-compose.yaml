networks:
  default:
    name: backend_net

  shared:
    external: true

services:
  backend:
    container_name: backend
    image: bosstnp/backend:latest
    restart: unless-stopped
    environment:
      PORT: 8080
      GRIST_ENDPOINT: http://grist:8484
      GRIST_DOCUMENT_ID: ${BACKEND_GRIST_DOCUMENT_ID}
      GRIST_API_KEY: ${BACKEND_GRIST_API_KEY}
      BACKEND_CURRENCY_TABLE_ID: ${BACKEND_CURRENCY_TABLE_ID}
      FRANKFURTER_ENDPOINT: https://api.frankfurter.dev
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - default
      - shared

  expenses:
    container_name: expenses
    image: bosstnp/expenses:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - default
      - shared
